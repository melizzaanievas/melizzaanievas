name: Latest Substack Posts Workflow
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-readme-with-blog:
    name: Update this repo's README with latest newsletter posts
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch latest Substack posts
        run: |
          python - <<'EOF'
          import json
          import re

          import requests

          feed_url = "https://ruleofinnovation.substack.com/feed"
          proxy_url = f"https://api.rss2json.com/v1/api.json?rss_url={feed_url}"
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
          }

          print("Fetching:", proxy_url)
          response = requests.get(proxy_url, headers=headers, timeout=30)
          print("Status:", response.status_code)
          print("Content-Type:", response.headers.get("Content-Type"))
          print(response.text[:500])

          if response.status_code != 200:
              raise RuntimeError(f"RSS proxy request failed: {response.status_code}")

          try:
              data = response.json()
          except Exception as e:
              print("JSON parse failed:", e)
              raise

          items = data.get("items") or []
          print("Found items:", len(items))

          posts = []
          for item in items[:5]:
              title = (item.get("title") or "").strip()
              link = (item.get("link") or "").strip()
              if title and link:
                  posts.append(f"- 📰 [{title}]({link})")

          if not posts:
              raise RuntimeError("No Substack posts returned by the RSS proxy.")

          with open("README.md", "r", encoding="utf-8") as f:
              readme = f.read()

          pattern = r"(<!-- BLOG-POST-LIST:START -->)(.*?)(<!-- BLOG-POST-LIST:END -->)"
          replacement = "\\1\n" + "\n".join(posts) + "\n\\3"
          updated_readme = re.sub(pattern, replacement, readme, flags=re.DOTALL)

          if updated_readme == readme:
              raise RuntimeError("README markers were not found or replacement did not change the file.")

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(updated_readme)

          print("SUCCESS: latest Substack posts synced to README.")
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff-index --quiet HEAD || git commit -m "docs: sync latest newsletter posts"
          git push origin main
