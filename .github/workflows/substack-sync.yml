name: Latest Substack Posts Workflow
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 

jobs:
  update-readme-with-blog:
    name: Update this repo's README with latest newsletter posts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests feedparser

      - name: Fetch and Inject Substack RSS Feed
        run: |
          python - <<'EOF'
          import requests
          import feedparser
          import re

          # Uses a clean public RSS proxy relay layer to bypass Substack's strict cloudflare firewall rules
          url = "https://migor.org"
          
          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
          }

          try:
              response = requests.get(url, headers=headers, timeout=20)
              response.raise_for_status()
              
              feed = feedparser.parse(response.content)
              
              posts_html = ""
              for entry in feed.entries[:4]:
                  title = entry.title
                  link = entry.link
                  posts_html += f"- 📰 [{title}]({link})\n"
                  
              if not posts_html:
                  print("The proxy endpoint returned zero parsed structural articles.")
                  exit(1)
              
              with open("README.md", "r", encoding="utf-8") as f:
                  readme = f.read()

              pattern = r"(<!-- BLOG-POST-LIST:START -->)(.*?)(<!-- BLOG-POST-LIST:END -->)"
              replacement = f"\\1\n{posts_html}\\3"
              
              updated_readme = re.sub(pattern, replacement, readme, flags=re.DOTALL)

              with open("README.md", "w", encoding="utf-8") as f:
                  f.write(updated_readme)
              print("Dynamic links loaded via Proxy successfully.")

          except Exception as e:
              print(f"Proxy Pipeline Error: {e}")
              exit(1)
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff-index --quiet HEAD || git commit -m "docs: auto-inject recent substack briefings via proxy 🗞"
          git push origin main
