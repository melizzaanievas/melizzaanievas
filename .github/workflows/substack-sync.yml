name: Latest Substack Posts Workflow
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 

jobs:
  update-readme-with-blog:
    name: Update this repo's README with latest newsletter posts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Feed Parser
        run: pip install feedparser

      - name: Fetch and Inject Substack RSS Feed
        run: |
          python - <<'EOF'
          import urllib.request
          import feedparser
          import re

          url = "https://substack.com"
          req = urllib.request.Request(
              url, 
              headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'}
          )

          try:
              html = urllib.request.urlopen(req).read()
              feed = feedparser.parse(html)
              
              posts_html = ""
              for entry in feed.entries[:4]:
                  title = entry.title
                  link = entry.link
                  posts_html += f"- 📰 [{title}]({link})\n"
              
              with open("README.md", "r", encoding="utf-8") as f:
                  readme = f.read()

              pattern = r"(<!-- BLOG-POST-LIST:START -->)(.*?)(<!-- BLOG-POST-LIST:END -->)"
              replacement = f"\\1\n{posts_html}\\3"
              
              updated_readme = re.sub(pattern, replacement, readme, flags=re.DOTALL)

              with open("README.md", "w", encoding="utf-8") as f:
                  f.write(updated_readme)
                  print("Substack RSS Feed injected successfully.")

          except Exception as e:
              print(f"Execution Error: {e}")
              exit(1)
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git add README.md
          git diff-index --quiet HEAD || git commit -m "docs: auto-inject recent substack briefings 🗞"
          git push origin main
