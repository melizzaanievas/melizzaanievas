name: Latest Substack Posts Workflow
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 

jobs:
  update-readme-with-blog:
    name: Update this repo's README with latest newsletter posts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Network Libraries
        run: pip install requests

      - name: Fetch and Inject Substack RSS Feed
        run: |
          python - <<'EOF'
          import requests
          import xml.etree.ElementTree as ET
          import re
          import html

          url = "https://substack.com"
          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
          }

          try:
              # Download stream cleanly via requests 
              response = requests.get(url, headers=headers, timeout=15)
              response.raise_for_status()
              
              # Enforce clear UTF-8 character conversion mapping
              feed_data = response.content.decode('utf-8')
              
              root = ET.fromstring(feed_data)
              channel = root.find('channel')
              items = channel.findall('item') if channel is not None else []
              
              posts_html = ""
              # Pull the 4 most recent articles cleanly
              for item in items[:4]:
                  title_elem = item.find('title')
                  link_elem = item.find('link')
                  
                  if title_elem is not None and link_elem is not None:
                      # Decode edge html character entities safely
                      title = html.unescape(title_elem.text)
                      link = link_elem.text.strip()
                      posts_html += f"- 📰 [{title}]({link})\n"
              
              # Open and modify target profile structure
              with open("README.md", "r", encoding="utf-8") as f:
                  readme = f.read()

              pattern = r"(<!-- BLOG-POST-LIST:START -->)(.*?)(<!-- BLOG-POST-LIST:END -->)"
              replacement = f"\\1\n{posts_html}\\3"
              
              updated_readme = re.sub(pattern, replacement, readme, flags=re.DOTALL)

              with open("README.md", "w", encoding="utf-8") as f:
                  f.write(updated_readme)
              print("Substack RSS layout injected successfully without errors.")

          except Exception as e:
              print(f"Execution Error Handler Triggered: {e}")
              exit(1)
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff-index --quiet HEAD || git commit -m "docs: auto-inject recent substack briefings 🗞"
          git push origin main
