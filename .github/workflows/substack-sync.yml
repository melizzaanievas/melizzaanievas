name: Latest Substack Posts Workflow
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 

jobs:
  update-readme-with-blog:
    name: Update this repo's README with latest newsletter posts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Engine
        run: pip install requests

      - name: Fetch and Inject Substack JSON API
        run: |
          python - <<'EOF'
          import requests
          import re
          import html

          # Hits Substack's native internal JSON content feed bypass layer
          url = "https://substack.com"
          
          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36'
          }

          try:
              response = requests.get(url, headers=headers, timeout=15)
              response.raise_for_status()
              
              posts_data = response.json()
              posts_html = ""
              
              for post in posts_data:
                  title = html.unescape(post.get('title', ''))
                  slug = post.get('slug', '')
                  # Programmatically reconstructs explicit canonical URL targets
                  link = f"https://ruleofinnovation.substack.com/p/{slug}"
                  
                  if title and slug:
                      posts_html += f"- 📰 [{title}]({link})\n"
                      
              if not posts_html:
                  print("API endpoint successfully parsed but returned an empty dataset structure.")
                  exit(1)
              
              with open("README.md", "r", encoding="utf-8") as f:
                  readme = f.read()

              pattern = r"(<!-- BLOG-POST-LIST:START -->)(.*?)(<!-- BLOG-POST-LIST:END -->)"
              replacement = f"\\1\n{posts_html}\\3"
              
              updated_readme = re.sub(pattern, replacement, readme, flags=re.DOTALL)

              with open("README.md", "w", encoding="utf-8") as f:
                  f.write(updated_readme)
              print("Dynamic links loaded natively via Substack Data Engine.")

          except Exception as e:
              print(f"Bypass Execution Failure: {e}")
              exit(1)
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff-index --quiet HEAD || git commit -m "docs: sync recent briefings via native api 🗞"
          git push origin main
